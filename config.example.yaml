# Precedence: flags > environment (CIC_ prefix, "." -> "_") > this file > defaults.
server:
  # NOTE: ":8080" listens on all interfaces. Every API call needs a login, but terminate TLS
  # in front (reverse proxy): session cookies are Secure and need HTTPS (browsers also accept
  # them on http://localhost and http://127.0.0.1).
  listen: ":8080"          # CIC_SERVER_LISTEN
  # Public URL. An https:// value enables HSTS and makes the login Origin check expect https.
  # With https here, ALSO list your reverse proxy in trusted_proxies (a warning is logged if not).
  base_url: ""             # CIC_SERVER_BASE_URL
  insecure_cookies: false  # CIC_SERVER_INSECURE_COOKIES / --insecure-cookies: drop the cookie's Secure flag (plain-HTTP dev only)
  # Reverse proxies (IPs or CIDRs) whose X-Forwarded-For / X-Forwarded-Proto are trusted:
  # client address for login rate limiting, and "request was https" for Origin checks and HSTS.
  # Empty = the TCP peer address is always used, so behind a proxy EVERY client shares the
  # proxy's address and its login rate-limit bucket.
  #
  # Login throttling (fixed policy): a USERNAME locks after 5 failures (30 s, doubling, max
  # 15 min) and a source address after 30 failures within 15 minutes (IPv6: per /64). The
  # username lockout is global by design: anyone who can reach the login page can lock a
  # known username out for a while by failing on purpose (denial of service on that account,
  # not a bypass). The lockout expires on its own; restarting the service clears it.
  trusted_proxies: []      # CIC_SERVER_TRUSTED_PROXIES (comma separated)
storage:
  path: "/data/cic.db"     # CIC_STORAGE_PATH
mqtt:
  prefixes: ["dradis"]     # CIC_MQTT_PREFIXES (comma separated)
  broker:
    host: ""               # CIC_MQTT_BROKER_HOST
    port: 1883             # CIC_MQTT_BROKER_PORT
    tls: false             # CIC_MQTT_BROKER_TLS
    ca_file: ""            # CIC_MQTT_BROKER_CA_FILE
    insecure_skip_verify: false  # CIC_MQTT_BROKER_INSECURE_SKIP_VERIFY
    username: ""           # CIC_MQTT_BROKER_USERNAME
    password: ""           # CIC_MQTT_BROKER_PASSWORD (secret)
devices:
  # A device is online when its last status is 1 and any live (non-retained) message arrived
  # within offline_after. Retained status only seeds the state of a device never seen live.
  # DRADIS publishes a heartbeat every 90 s by default (minimum 15 s): keep this above that.
  offline_after: 5m        # CIC_DEVICES_OFFLINE_AFTER
  # Maximum number of auto-discovered devices; 0 = unlimited. Beyond it, unknown devices are
  # ignored. Broker ACLs must restrict who may publish under the configured mqtt.prefixes.
  max_devices: 500         # CIC_DEVICES_MAX_DEVICES
commands:
  ping_seconds: 3          # CIC_COMMANDS_PING_SECONDS
  sms_daily_cap: 50        # CIC_COMMANDS_SMS_DAILY_CAP; billed SMS segments per UTC day, 0 disables
geocode:
  enabled: true            # CIC_GEOCODE_ENABLED
  api_key: ""              # CIC_GEOCODE_API_KEY (secret)
  min_move_meters: 150     # CIC_GEOCODE_MIN_MOVE_METERS
  max_age: 24h             # CIC_GEOCODE_MAX_AGE
  daily_cap: 250           # CIC_GEOCODE_DAILY_CAP
  reserve: 20              # CIC_GEOCODE_RESERVE
map:
  provider: "openfreemap"  # CIC_MAP_PROVIDER: openfreemap | latlng
  latlng_maps_key: ""      # CIC_MAP_LATLNG_MAPS_KEY
auth:
  oidc:
    enabled: false                          # CIC_AUTH_OIDC_ENABLED
    issuer: "https://accounts.google.com"   # CIC_AUTH_OIDC_ISSUER
    client_id: ""                           # CIC_AUTH_OIDC_CLIENT_ID
    client_secret: ""                       # CIC_AUTH_OIDC_CLIENT_SECRET (secret)
    allowed_emails: []                      # CIC_AUTH_OIDC_ALLOWED_EMAILS
audit:
  retention: 2160h         # CIC_AUDIT_RETENTION
log:
  level: "info"            # CIC_LOG_LEVEL: debug | info | warn (or warning) | error
  format: "text"           # CIC_LOG_FORMAT: text | json
# Environment-only secrets (not config keys):
#   CIC_ADMIN_PASSWORD  initial admin password (min 12 chars); if unset a random one is logged once at first start
#   CIC_SECRET_KEY      AES-256-GCM key for secrets at rest: 64 hex chars or base64 of 32 bytes (openssl rand -hex 32)
