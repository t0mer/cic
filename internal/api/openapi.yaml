openapi: 3.0.3
info:
  title: CIC API
  version: "1.0.0"
  description: >
    API for DRADIS devices. Every endpoint except `POST /api/auth/login` requires a session:
    log in to receive the `__Host-cic_session` cookie (HttpOnly, Secure, SameSite=Strict; plain `cic_session` only with --insecure-cookies), then send it
    with every request. State-changing requests (anything but GET, HEAD and OPTIONS) must also
    carry the header `X-CSRF-Token` with the `csrf_token` returned by login or `GET /api/auth/me`
    and must be same-origin: the request needs an `Origin` header matching scheme and Host, or
    `Sec-Fetch-Site: same-origin|none`; with neither header (or `Origin: null`, or `cross-site`/`same-site`) it is rejected
    with 403. While `must_change_password` is true every endpoint except
    `/api/auth/me`, `/api/auth/logout` and `/api/auth/change-password` answers
    `403 {"error":"password change required"}`. Roles: `admin` may do everything, `viewer` is read-only.
security:
  - cookieAuth: []
paths:
  /api/auth/login:
    post:
      summary: Log in
      description: >
        Creates a session and sets the `__Host-cic_session` cookie. A user holds at most 10 sessions (least recently used is evicted). The Origin/Sec-Fetch-Site check applies;
        no CSRF token is needed. Failures (unknown user, wrong password, disabled user) all return the
        same 401. Failed attempts are rate limited per username (5 failures: 30 s, doubling, capped at 15 min;
        a deliberate failure storm can therefore lock a known username out for a while) and per source address
        (30 failures in 15 minutes; IPv6 clients are keyed by /64). A locked key answers 429 whatever the password.
        The source IP is the TCP peer unless `server.trusted_proxies` matches it. When too many password checks are
        already queued the answer is `503 {"error":"busy"}` and no failure is recorded.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: >
            Logged in (session cookie set), or, for a user with two-factor login on and a correct
            password, `mfa_required` with a short-lived `mfa_token` and NO cookie: finish with
            `POST /api/auth/login/2fa`. A correct password in the two-factor case does not clear the
            account's failure counter; that happens only when the second factor passes.
          headers:
            Set-Cookie:
              description: "Only on a completed login. `__Host-cic_session=<opaque>; Path=/; HttpOnly; Secure; SameSite=Strict` (with --insecure-cookies: `cic_session=<opaque>; Path=/; HttpOnly; SameSite=Strict`)."
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/LoginResponse" }
                  - { $ref: "#/components/schemas/MfaRequired" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Too many password checks queued; nothing was counted against the account. Retry shortly.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/login/2fa:
    post:
      summary: Finish a two-factor login
      description: >
        Second step after `POST /api/auth/login` returned `mfa_required`. `code` is the current 6-digit
        authenticator code or an unused backup code (consumed on use; each authenticator time step works
        once). The `mfa_token` lives 5 minutes, is single use and dies after 5 wrong codes. A wrong code
        counts against the same per-username and per-address limits as a wrong password (429 when locked).
        An unknown, expired or exhausted token answers `401 {"error":"login expired, sign in again"}`; a wrong
        code `401 {"error":"invalid code"}`. Same-origin check applies; no CSRF token is needed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Login2FARequest" }
      responses:
        "200":
          description: Logged in; same body and cookie as a plain login.
          headers:
            Set-Cookie:
              description: The new session cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: Secret key missing or server busy; nothing was counted against the account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/auth/2fa:
    get:
      summary: Two-factor status of the current user
      description: Any signed-in user manages only their own two-factor login.
      responses:
        "200":
          description: Status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/2fa/setup:
    post:
      summary: Start two-factor setup
      description: >
        Verifies `current_password`, generates a new secret and stores it pending (not active until
        `/2fa/enable`; calling again replaces it). Rate limited on its own key (`2fa:<user>`). `409` when
        two-factor login is already on; `503` when the server has no secret key (CIC_SECRET_KEY or
        secret.key). The response is `no-store`.
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordRequest" }
      responses:
        "200":
          description: Secret and provisioning URI (issuer `CIC`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TwoFactorSetup" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
  /api/auth/2fa/enable:
    post:
      summary: Turn two-factor login on
      description: >
        Verifies the first code against the pending secret, enables two-factor login and returns ten
        backup codes, shown once. Ends the user's other sessions. `401 invalid code`, `409` when
        nothing is pending or it is already on, `503` without a secret key. The response is `no-store`.
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupCodes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
  /api/auth/2fa/disable:
    post:
      summary: Turn two-factor login off
      description: >
        Needs the current password AND a current code or unused backup code. Deletes the secret and all
        backup codes and ends the user's other sessions. `409` when it is not on.
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordCodeRequest" }
      responses:
        "204": { description: Disabled. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
  /api/auth/2fa/backup-codes:
    post:
      summary: Regenerate backup codes
      description: >
        Needs the current password AND a current code or unused backup code. Replaces all backup codes
        (the old ones stop working) and returns the new ten once. The response is `no-store`.
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordCodeRequest" }
      responses:
        "200":
          description: New backup codes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupCodes" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/Error" }
  /api/auth/logout:
    post:
      summary: Log out
      description: Deletes the session server-side and clears the cookie. Requires the CSRF header.
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "204": { description: Logged out. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/auth/me:
    get:
      summary: Current user
      description: Allowed while a password change is pending. Returns the CSRF token for this session.
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/change-password:
    post:
      summary: Change the current user's password
      description: >
        Verifies `current_password`, applies the policy (at least 12 characters, not equal to the
        username, not a single repeated character, different from the current one), ends every other
        session of the user and rotates this session to a new id and CSRF token (a new cookie is set).
        Wrong `current_password` counts toward the username lockout.
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200":
          description: Password changed; same body as login, with the new CSRF token.
          headers:
            Set-Cookie:
              description: The rotated session cookie.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/devices:
    get:
      summary: List devices
      parameters:
        - name: include_hidden
          in: query
          description: Set to 1 to include hidden devices. Administrators only; for a viewer the parameter is ignored and hidden devices are never returned.
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Devices sorted by full name, then key.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/Error" }
  /api/devices/{prefix}/{device}:
    get:
      summary: Get one device
      description: A hidden device is answered 404 to viewers.
      parameters:
        - { name: prefix, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { name: device, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
      responses:
        "200":
          description: The device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
    patch:
      summary: Edit a device (admin)
      description: >
        Partial update: omitted fields stay unchanged. `full_name` is trimmed with runs of spaces collapsed, at most 80 characters,
        without control, format or line/paragraph separator characters and with at least one visible
        character (blank fillers such as U+3164 are refused); an empty value resets it to the device segment.
        `color` is empty (reset) or `#rrggbb`. Publishes `device.updated` and writes a `device_update`
        audit row listing only the changed field names. At most 30 settings writes per minute per admin.
      parameters:
        - { name: prefix, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { name: device, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DevicePatch" }
      responses:
        "200":
          description: The updated device.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Device" }
        "400": { $ref: "#/components/responses/SettingsError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SettingsError" }
        "413": { $ref: "#/components/responses/SettingsError" }
        "415": { $ref: "#/components/responses/SettingsError" }
        "429": { $ref: "#/components/responses/SettingsRateLimited" }
        "500": { $ref: "#/components/responses/SettingsError" }
        "503": { $ref: "#/components/responses/SettingsError" }
    delete:
      summary: Remove a device (admin)
      description: >
        Deletes the row; it reappears if the phone publishes again. Publishes `device.removed`
        and writes a `device_delete` audit row.
      parameters:
        - { name: prefix, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { name: device, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "204": { description: Removed. }
        "400": { $ref: "#/components/responses/SettingsError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SettingsError" }
        "429": { $ref: "#/components/responses/SettingsRateLimited" }
        "500": { $ref: "#/components/responses/SettingsError" }
        "503": { $ref: "#/components/responses/SettingsError" }
  /api/devices/{prefix}/{device}/ping:
    post:
      summary: Start a ping (find my phone)
      description: >
        Makes the phone ring for `seconds` (1-600; omitted or 0 means the configured default). The body is optional; when present Content-Type must be application/json and unknown fields are rejected. Admin only (viewers get 403). Rate limited per user per minute.
        Returns 202 once the broker acknowledged the publish; the device's reaction is not awaited.
      parameters:
        - { name: prefix, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { name: device, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PingRequest" }
      responses:
        "202":
          description: Command published (action `ping`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandAccepted" }
        "400": { $ref: "#/components/responses/CommandError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CommandForbidden" }
        "404": { $ref: "#/components/responses/CommandError" }
        "413": { $ref: "#/components/responses/CommandError" }
        "415": { $ref: "#/components/responses/CommandError" }
        "429": { $ref: "#/components/responses/CommandRateLimited" }
        "503": { $ref: "#/components/responses/CommandError" }
        "504": { $ref: "#/components/responses/CommandOutcomeUnknown" }
  /api/devices/{prefix}/{device}/ping/stop:
    post:
      summary: Stop a running ping
      description: >
        Stops the ping. No body. Admin only (viewers get 403). Rate limited per user per minute.
        Returns 202 once the broker acknowledged the publish; the device's reaction is not awaited.
      parameters:
        - { name: prefix, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { name: device, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "202":
          description: Command published (action `ping_stop`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandAccepted" }
        "400": { $ref: "#/components/responses/CommandError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CommandForbidden" }
        "404": { $ref: "#/components/responses/CommandError" }
        "413": { $ref: "#/components/responses/CommandError" }
        "415": { $ref: "#/components/responses/CommandError" }
        "429": { $ref: "#/components/responses/CommandRateLimited" }
        "503": { $ref: "#/components/responses/CommandError" }
        "504": { $ref: "#/components/responses/CommandOutcomeUnknown" }
  /api/devices/{prefix}/{device}/notify:
    post:
      summary: Show a notification on the device
      description: >
        Shows a notification; an empty title becomes `CIC`. Admin only (viewers get 403). Rate limited per user per minute.
        Returns 202 once the broker acknowledged the publish; the device's reaction is not awaited.
      parameters:
        - { name: prefix, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { name: device, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotifyRequest" }
      responses:
        "202":
          description: Command published (action `notify`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandAccepted" }
        "400": { $ref: "#/components/responses/CommandError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CommandForbidden" }
        "404": { $ref: "#/components/responses/CommandError" }
        "413": { $ref: "#/components/responses/CommandError" }
        "415": { $ref: "#/components/responses/CommandError" }
        "429": { $ref: "#/components/responses/CommandRateLimited" }
        "503": { $ref: "#/components/responses/CommandError" }
        "504": { $ref: "#/components/responses/CommandOutcomeUnknown" }
  /api/devices/{prefix}/{device}/sms:
    post:
      summary: Send an SMS from the device
      description: >
        Asks the phone to send an SMS to an E.164 number. Counted in billed segments against `commands.sms_daily_cap` (0 disables SMS: 403 `sms_disabled`), at most 3 per recipient per hour. Only a 202 means the request was published; the delivery outcome arrives later as the `command.result` SSE event. Admin only (viewers get 403). Rate limited per user per minute.
        Returns 202 once the broker acknowledged the publish; the device's reaction is not awaited.
      parameters:
        - { name: prefix, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { name: device, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SMSRequest" }
      responses:
        "202":
          description: Command published (action `sms`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandAccepted" }
        "400": { $ref: "#/components/responses/CommandError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CommandForbidden" }
        "404": { $ref: "#/components/responses/CommandError" }
        "413": { $ref: "#/components/responses/CommandError" }
        "415": { $ref: "#/components/responses/CommandError" }
        "429": { $ref: "#/components/responses/CommandRateLimited" }
        "503": { $ref: "#/components/responses/CommandError" }
        "504": { $ref: "#/components/responses/CommandOutcomeUnknown" }
  /api/devices/{prefix}/{device}/refresh-status:
    post:
      summary: Ask the device to republish its status
      description: >
        No body. Admin only (viewers get 403). Rate limited per user per minute.
        Returns 202 once the broker acknowledged the publish; the device's reaction is not awaited.
      parameters:
        - { name: prefix, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { name: device, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "202":
          description: Command published (action `getstatus`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandAccepted" }
        "400": { $ref: "#/components/responses/CommandError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CommandForbidden" }
        "404": { $ref: "#/components/responses/CommandError" }
        "413": { $ref: "#/components/responses/CommandError" }
        "415": { $ref: "#/components/responses/CommandError" }
        "429": { $ref: "#/components/responses/CommandRateLimited" }
        "503": { $ref: "#/components/responses/CommandError" }
        "504": { $ref: "#/components/responses/CommandOutcomeUnknown" }
  /api/devices/{prefix}/{device}/refresh-location:
    post:
      summary: Ask the device to publish its location
      description: >
        No body. Admin only (viewers get 403). Rate limited per user per minute.
        Returns 202 once the broker acknowledged the publish; the device's reaction is not awaited.
      parameters:
        - { name: prefix, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { name: device, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "202":
          description: Command published (action `getlocation`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandAccepted" }
        "400": { $ref: "#/components/responses/CommandError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/CommandForbidden" }
        "404": { $ref: "#/components/responses/CommandError" }
        "413": { $ref: "#/components/responses/CommandError" }
        "415": { $ref: "#/components/responses/CommandError" }
        "429": { $ref: "#/components/responses/CommandRateLimited" }
        "503": { $ref: "#/components/responses/CommandError" }
        "504": { $ref: "#/components/responses/CommandOutcomeUnknown" }
  /api/devices/{prefix}/{device}/history:
    get:
      summary: Location history of a device (admin)
      description: >
        Recorded location points of one device, ascending by time. Administrators only, including hidden devices
        (administrators see them in the device list too); reads write no audit rows and are limited to 120 per
        minute per user (429 `rate_limited`). Defaults to the last 24 hours; the range must satisfy from < to and span
        at most 31 days. When more than `limit` points match they are downsampled evenly on the server (first and last
        point always kept) and `truncated` is true. A range matching more than 200000 rows is thinned in SQL first.
        Stored data is served even when `history_enabled` is false.
      parameters:
        - { name: prefix, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { name: device, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: "RFC 3339; default `to` minus 24 h" }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: "RFC 3339; default now" }
        - { name: limit, in: query, schema: { type: integer, minimum: 2, maximum: 20000, default: 5000 }, description: "Values above 20000 are clamped" }
      responses:
        "200":
          description: The points.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationHistory" }
        "400":
          description: "`invalid`: bad time, from >= to, range over 31 days, bad limit."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`unknown_device`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/devices/{prefix}/{device}/routes:
    get:
      summary: Daily routes of a device (admin)
      description: >
        Points grouped by local calendar day in `tz` (default UTC; DST days use each point's local date), ascending.
        A day is split into segments where consecutive points are more than 30 minutes apart. Single-point segments
        are counted in `point_count` but omitted from `segments`. Segments are simplified (Douglas-Peucker, 10 m,
        endpoints kept); `distance_m` is the sum of great-circle distances over the unsimplified points inside segments,
        never across gaps. Same access, range, rate limit and hidden-device rules as the history route.
      parameters:
        - { name: prefix, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { name: device, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,64}$" } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: tz, in: query, schema: { type: string, example: Asia/Jerusalem }, description: IANA time zone name, default UTC }
      responses:
        "200":
          description: The routes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceRoutes" }
        "400":
          description: "`invalid`: as for history, or an unknown `tz`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: "`unknown_device`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/places:
    get:
      summary: List safe places
      description: Administrators only (viewers get `safe_place` on each device). Sorted by name (case-insensitive).
      responses:
        "200":
          description: All safe places.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Place" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      summary: Create a safe place (admin)
      description: >
        Name is trimmed, 1-40 characters without control characters, unique case-insensitively (409 `duplicate_name`).
        Latitude -90..90, longitude -180..180, radius 10-50000 m, at most 100 places (400 `invalid`).
        Audit: `place_create`. Device `safe_place` fields update live through `device.updated` events.
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaceInput" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Place" }
        "400": { $ref: "#/components/responses/SettingsError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/SettingsError" }
        "429": { $ref: "#/components/responses/SettingsRateLimited" }
        "500": { $ref: "#/components/responses/SettingsError" }
        "503": { $ref: "#/components/responses/SettingsError" }
  /api/places/{id}:
    patch:
      summary: Edit a safe place (admin)
      description: >
        Partial update: omitted fields stay unchanged; the merged place is validated as on create. Audit `place_update`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlacePatch" }
      responses:
        "200":
          description: The updated place.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Place" }
        "400": { $ref: "#/components/responses/SettingsError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SettingsError" }
        "409": { $ref: "#/components/responses/SettingsError" }
        "429": { $ref: "#/components/responses/SettingsRateLimited" }
        "500": { $ref: "#/components/responses/SettingsError" }
        "503": { $ref: "#/components/responses/SettingsError" }
    delete:
      summary: Delete a safe place (admin)
      description: Audit `place_delete`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "204": { description: Deleted. }
        "400": { $ref: "#/components/responses/SettingsError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SettingsError" }
        "429": { $ref: "#/components/responses/SettingsRateLimited" }
        "500": { $ref: "#/components/responses/SettingsError" }
        "503": { $ref: "#/components/responses/SettingsError" }
  /api/users:
    get:
      summary: List users (admin)
      responses:
        "200":
          description: All accounts sorted by username. Never carries password material.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ManagedUser" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/SettingsError" }
    post:
      summary: Create a user (admin)
      description: >
        Username policy as `cic user add`: 3-64 of A-Z a-z 0-9 . _ -, unique case-insensitively.
        Without `password` the server generates one and returns it once as `initial_password`;
        a supplied password must satisfy the policy (min 12 characters, not equal to the username,
        not a single repeated character). Either way the user must change the password at first login.
        Audit: `user_create`. The password is never audited, logged or published. The response carries
        `Cache-Control: no-store` and `Pragma: no-cache`. Password hashing shares a small process-wide budget with
        logins; when it stays exhausted for 5 s the answer is 503 `busy` (audit `rejected:busy`).
      parameters:
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CreateUserResponse" }
        "400": { $ref: "#/components/responses/SettingsError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/SettingsError" }
        "413": { $ref: "#/components/responses/SettingsError" }
        "415": { $ref: "#/components/responses/SettingsError" }
        "429": { $ref: "#/components/responses/SettingsRateLimited" }
        "500": { $ref: "#/components/responses/SettingsError" }
        "503": { $ref: "#/components/responses/SettingsError" }
  /api/users/{id}:
    patch:
      summary: Change a user's role or disabled flag (admin)
      description: >
        Partial update. An admin cannot disable or demote themselves, and the last active admin can
        never be disabled or demoted (checked atomically): both answer 409 `forbidden_change`.
        Disabling or changing the role ends all of the user's sessions and event streams.
        Audit: `user_update` with the changed field names only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: "#/components/parameters/CSRF" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPatch" }
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ManagedUser" }
        "400": { $ref: "#/components/responses/SettingsError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SettingsError" }
        "409": { $ref: "#/components/responses/SettingsError" }
        "413": { $ref: "#/components/responses/SettingsError" }
        "415": { $ref: "#/components/responses/SettingsError" }
        "429": { $ref: "#/components/responses/SettingsRateLimited" }
        "500": { $ref: "#/components/responses/SettingsError" }
        "503": { $ref: "#/components/responses/SettingsError" }
  /api/users/{id}/reset-password:
    post:
      summary: Reset a user's password (admin)
      description: >
        Generates a new password, returns it once, sets `must_change_password` and ends all of the
        user's sessions and event streams. No request body. Audit: `user_reset_password`. The response carries
        `Cache-Control: no-store` and `Pragma: no-cache`; a hashing budget that stays exhausted for 5 s gives
        503 `busy` (audit `rejected:busy`).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { $ref: "#/components/parameters/CSRF" }
      responses:
        "200":
          description: The one-time password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetPasswordResponse" }
        "400": { $ref: "#/components/responses/SettingsError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/SettingsError" }
        "429": { $ref: "#/components/responses/SettingsRateLimited" }
        "500": { $ref: "#/components/responses/SettingsError" }
        "503": { $ref: "#/components/responses/SettingsError" }
  /api/activity:
    get:
      summary: Command audit log
      description: >
        Admin only. Every command attempt, newest first. A row is written as `pending` before the command is
        published (if that fails the command is refused with 503 `unavailable`), then becomes `sent`,
        `rejected:<code>` or `unknown` (outcome not confirmed; rows left `pending` by a crash also become
        `unknown` at startup). Rejected rows are capped at 60 per user per hour and the table at 200,000 rows
        (oldest 5% dropped); `audit.retention` of zero or less means the default 2160h. SMS rows start as `sent` and change to
        `confirmed_ok`, `failed` or `no_confirmation` when the phone's result arrives (or 60 s pass).
        `detail` is at most 120 bytes and holds only the text length, its first 20 characters, and the phone
        masked to its last 3 digits (`phone=invalid` when the number is malformed); never a full phone number
        or full message text.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before, in: query, description: "Return rows with id lower than this (use `next_before` of the previous page).", schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200":
          description: One page of the audit log.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityPage" }
        "400": { $ref: "#/components/responses/CommandError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/CommandError" }
  /api/broker:
    get:
      summary: MQTT broker connection state
      responses:
        "200":
          description: Broker state. Credentials are never included.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Broker" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/ui-config:
    get:
      summary: Browser configuration (map styles, geocoding availability)
      description: >
        Any authenticated user. Never contains secrets: the geocode server key is not included,
        only whether geocoding is usable. The style URLs may embed the public maps key (`pk_`),
        which is browser-safe by design.
      responses:
        "200":
          description: UI configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UIConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/geocode/usage:
    get:
      summary: Reverse-geocoding usage today (UTC)
      description: >
        Administrators only. Counts provider calls and cache hits of the current UTC day.
        `remaining` is the smaller of the local daily cap minus calls and the provider's last
        reported remaining quota. `blocked_until` is set while lookups are paused after a 429.
        When geocoding is not configured, `enabled` is false and the counters are zero.
      responses:
        "200":
          description: Usage.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeocodeUsage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/events:
    get:
      summary: Server-Sent Events stream
      description: >
        Sends `hello` (a Broker object) on connect, then `device.updated` (Device),
        `device.removed` ({key}), `broker.state` (Broker) and `command.result` (CommandResult: the
        outcome of an SMS, published when the phone reports it or, failing that, 60 s after sending as
        `no_confirmation`; it never carries the raw phone number or the text). `command.result` is sent to administrator sessions
        only; viewers never receive it. Hidden devices are never sent to viewers: when a device becomes hidden
        a viewer stream receives `device.removed` for it instead of `device.updated`. A `: ping` comment is sent
        every 25 seconds. Last-Event-ID is ignored; refetch /api/devices after reconnecting.
        The stream ends immediately when its session ends (logout, password change, disabling, eviction).
        A user may hold at most 5 streams; the 6th is refused with 429.
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Error" }
  /api/openapi.yaml:
    get:
      summary: This specification
      responses:
        "200":
          description: OpenAPI document.
          content:
            application/yaml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-cic_session
      description: >
        Session cookie set by POST /api/auth/login (named `cic_session` instead when the server runs with
        --insecure-cookies; the two names are never accepted together). State-changing requests additionally need
        the `X-CSRF-Token` header (see the CSRF parameter).
  parameters:
    CSRF:
      name: X-CSRF-Token
      in: header
      required: true
      description: The `csrf_token` of the current session (from login or GET /api/auth/me).
      schema: { type: string }
  responses:
    Unauthorized:
      description: No valid session (or, for login, invalid credentials).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: >
        Rejected: missing/invalid CSRF token, cross-site request, insufficient role (`forbidden`),
        or `password change required`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Login (or password change, or opening another event stream) refused after repeated failures or over the per-user limit.
      headers:
        Retry-After:
          description: Seconds until the next attempt is accepted.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    CommandError:
      description: "Command error; `code` says why: `invalid` 400/413/415, `unknown_device` 404, `not_connected` and `unavailable` 503 (nothing was sent; `unavailable` is also returned when the audit intent row could not be written, in which case nothing is published)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CommandError" }
    CommandForbidden:
      description: "Rejected by the session layer (missing CSRF token, or the viewer role: error `forbidden`, no `code`) or `sms_disabled` (`code` present)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CommandError" }
    CommandRateLimited:
      description: "`rate_limited` (per-user per-minute), `recipient_limited` (3 SMS per number per hour) or `sms_cap` (daily segment cap). Retry-After is an upper bound in seconds."
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CommandError" }
    CommandOutcomeUnknown:
      description: >
        `outcome_unknown`: the broker did not confirm in time. The command MAY still be delivered
        (and an SMS reservation is kept). Commands are not idempotent: clients and proxies must NOT
        retry automatically; the body carries `"retry": false` and the response is `Cache-Control: no-store`.
        The audit row is `unknown`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/CommandError" }
    SettingsError:
      description: "Settings error; `code` says why: `invalid` 400/413/415, `unknown_device` or `not_found` 404, `user_exists`, `duplicate_name` or `forbidden_change` 409, `unavailable` 500/503 (nothing was changed), `busy` 503 (password hashing capacity stayed exhausted for 5 s; retry later, nothing was changed)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SettingsError" }
    SettingsRateLimited:
      description: "`rate_limited`: more than 30 settings writes in a minute by this admin."
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SettingsError" }
    Error:
      description: Error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    GeocodeUsage:
      type: object
      required: [enabled, calls_today, cache_hits_today, daily_cap, remaining, last_remaining, blocked_until, cache_hit_ratio]
      properties:
        enabled: { type: boolean }
        calls_today: { type: integer }
        cache_hits_today: { type: integer }
        daily_cap: { type: integer }
        remaining: { type: integer, description: "min(daily_cap - calls_today, last_remaining when known)" }
        last_remaining: { type: integer, nullable: true, description: "Provider X-RateLimit-Remaining at the last call today" }
        blocked_until: { type: string, format: date-time, nullable: true }
        cache_hit_ratio: { type: number, description: "cache_hits / (calls + cache_hits) today, 0 when none" }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, description: "Case-insensitive; 3-64 of A-Z a-z 0-9 . _ -" }
        password: { type: string }
    User:
      type: object
      required: [username, role, must_change_password, totp_enabled]
      properties:
        username: { type: string }
        role: { type: string, enum: [admin, viewer] }
        must_change_password: { type: boolean }
        totp_enabled: { type: boolean }
    MfaRequired:
      type: object
      required: [mfa_required, mfa_token]
      properties:
        mfa_required: { type: boolean, enum: [true] }
        mfa_token: { type: string, description: "256-bit URL-safe token; valid 5 minutes, single use, 5 wrong codes" }
    Login2FARequest:
      type: object
      required: [mfa_token, code]
      properties:
        mfa_token: { type: string }
        code: { type: string, description: "6-digit authenticator code or a backup code (XXXXX-XXXXX)" }
    PasswordRequest:
      type: object
      required: [current_password]
      properties:
        current_password: { type: string }
    CodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    PasswordCodeRequest:
      type: object
      required: [current_password, code]
      properties:
        current_password: { type: string }
        code: { type: string, description: "Authenticator code or unused backup code" }
    TwoFactorStatus:
      type: object
      required: [enabled, backup_codes_remaining]
      properties:
        enabled: { type: boolean }
        backup_codes_remaining: { type: integer }
    TwoFactorSetup:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: "Base32 secret, shown once" }
        otpauth_uri: { type: string }
    BackupCodes:
      type: object
      required: [backup_codes]
      properties:
        backup_codes: { type: array, items: { type: string }, description: "Ten codes, shown once" }
    LoginResponse:
      type: object
      required: [user, csrf_token]
      properties:
        user: { $ref: "#/components/schemas/User" }
        csrf_token: { type: string }
    Me:
      type: object
      required: [username, role, must_change_password, totp_enabled, csrf_token]
      properties:
        username: { type: string }
        role: { type: string, enum: [admin, viewer] }
        must_change_password: { type: boolean }
        totp_enabled: { type: boolean }
        csrf_token: { type: string }
    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password: { type: string, minLength: 12 }
    SettingsError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string, enum: [invalid, unknown_device, not_found, user_exists, duplicate_name, forbidden_change, rate_limited, unavailable, busy] }
    Place:
      type: object
      required: [id, name, latitude, longitude, radius_m]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        radius_m: { type: integer, minimum: 10, maximum: 50000 }
    PlaceInput:
      type: object
      additionalProperties: false
      required: [name, latitude, longitude, radius_m]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        radius_m: { type: integer, minimum: 10, maximum: 50000 }
    PlacePatch:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        radius_m: { type: integer, minimum: 10, maximum: 50000 }
    DevicePatch:
      type: object
      additionalProperties: false
      properties:
        full_name: { type: string, description: "Trimmed; at most 80 characters; no control/format characters; empty resets to the device segment" }
        color: { type: string, pattern: "^(#[0-9a-fA-F]{6})?$", description: "Empty resets" }
        hidden: { type: boolean }
    ManagedUser:
      type: object
      required: [id, username, role, disabled, must_change_password, created_at, last_login]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string, enum: [admin, viewer] }
        disabled: { type: boolean }
        must_change_password: { type: boolean }
        created_at: { type: string, format: date-time }
        last_login: { type: string, format: date-time, nullable: true }
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, role]
      properties:
        username: { type: string, pattern: "^[A-Za-z0-9._-]{3,64}$" }
        role: { type: string, enum: [admin, viewer] }
        password: { type: string, minLength: 12, description: "Optional; generated when omitted" }
    CreateUserResponse:
      type: object
      required: [user, initial_password]
      properties:
        user: { $ref: "#/components/schemas/ManagedUser" }
        initial_password: { type: string, nullable: true, description: "Shown once, only when the server generated the password; null when one was supplied" }
    UserPatch:
      type: object
      additionalProperties: false
      properties:
        role: { type: string, enum: [admin, viewer] }
        disabled: { type: boolean }
    ResetPasswordResponse:
      type: object
      required: [initial_password]
      properties:
        initial_password: { type: string, description: "Shown once" }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    CommandError:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string, enum: [invalid, unknown_device, rate_limited, sms_cap, recipient_limited, sms_disabled, not_connected, outcome_unknown, unavailable] }
        retry: { type: boolean, enum: [false], description: "Present only for `outcome_unknown`: do not retry automatically." }
    CommandAccepted:
      type: object
      required: [id, action, device, sent_at]
      properties:
        id: { type: string }
        action: { type: string, enum: [ping, ping_stop, notify, sms, getstatus, getlocation] }
        device: { type: string, description: "<prefix>/<device>" }
        sent_at: { type: string, format: date-time }
    PingRequest:
      type: object
      additionalProperties: false
      properties:
        seconds: { type: integer, minimum: 0, maximum: 600, description: "0 or omitted: configured default" }
    NotifyRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        title: { type: string, maxLength: 100, description: "Default `CIC`" }
        text: { type: string, maxLength: 1000 }
    SMSRequest:
      type: object
      additionalProperties: false
      required: [phone, text]
      properties:
        phone: { type: string, pattern: "^\\+[1-9][0-9]{6,14}$", description: "E.164" }
        text: { type: string, maxLength: 1600 }
    CommandResult:
      type: object
      description: Data of the `command.result` SSE event.
      required: [id, action, device, status]
      properties:
        id: { type: string }
        action: { type: string, enum: [sms] }
        device: { type: string }
        status: { type: string, enum: [confirmed_ok, failed, no_confirmation] }
        error: { type: string, maxLength: 120, description: "Sanitized phone-side error (number-like digit runs removed), at most 120 characters, only for failed" }
        phone_masked: { type: string, example: "+*********567" }
    ActivityItem:
      type: object
      required: [id, at, user, device, action, status, detail]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        user: { type: string }
        device: { type: string }
        action: { type: string }
        status: { type: string, description: "pending, sent, unknown, rejected:<code>, confirmed_ok, failed or no_confirmation" }
        detail: { type: string, description: "sms: `phone=<masked> len=<n> \"<first 20 chars>\"`; notify: `len=<n> \"<first 20 chars>\"`; ping: `seconds=<n|default>`" }
    ActivityPage:
      type: object
      required: [items, next_before]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ActivityItem" }
        next_before: { type: integer, format: int64, nullable: true }
    Broker:
      type: object
      required: [connected, host, last_error, since]
      properties:
        connected: { type: boolean }
        host: { type: string, description: "host:port, empty when no broker is configured" }
        last_error: { type: string }
        since: { type: string, format: date-time, nullable: true }
    UIConfig:
      type: object
      required: [map, geocode_enabled, history_enabled]
      properties:
        map:
          type: object
          required: [provider, style_light, style_dark, attribution]
          properties:
            provider: { type: string, enum: [openfreemap, latlng] }
            style_light: { type: string, format: uri, description: MapLibre style URL for the light theme }
            style_dark: { type: string, format: uri, description: MapLibre style URL for the dark theme }
            attribution: { type: string, description: "Text to show on the map, e.g. `© OpenStreetMap contributors · OpenFreeMap`" }
        geocode_enabled: { type: boolean, description: "True when reverse geocoding is enabled and a valid server key is configured" }
        history_enabled: { type: boolean, description: "True when the location history recorder is on (`locations.enabled`)" }
    LocationHistory:
      type: object
      required: [points, truncated]
      properties:
        points:
          type: array
          items:
            type: object
            required: [t, lat, lon, accuracy]
            properties:
              t: { type: integer, format: int64, description: Fix time, unix seconds }
              lat: { type: number }
              lon: { type: number }
              accuracy: { type: number, nullable: true, description: Metres }
        truncated: { type: boolean, description: True when points were downsampled }
    DeviceRoutes:
      type: object
      required: [days]
      properties:
        days:
          type: array
          items:
            type: object
            required: [date, distance_m, point_count, first, last, segments]
            properties:
              date: { type: string, example: "2026-10-25", description: Local calendar day in `tz` }
              distance_m: { type: number }
              point_count: { type: integer }
              first: { type: integer, format: int64, description: Unix seconds of the first point }
              last: { type: integer, format: int64, description: Unix seconds of the last point }
              segments:
                type: array
                items:
                  type: array
                  description: Simplified polyline of at least two points
                  items:
                    type: array
                    minItems: 3
                    maxItems: 3
                    items: { type: number }
                    description: "[lat, lon, t(unix s)]"
    Device:
      type: object
      required: [key, prefix, device, full_name, color, hidden, online, last_seen, created_at]
      properties:
        key: { type: string }
        prefix: { type: string }
        device: { type: string }
        full_name: { type: string }
        color: { type: string }
        hidden: { type: boolean }
        online: { type: boolean }
        status: { type: boolean, nullable: true }
        version: { type: string, nullable: true }
        battery_level: { type: integer, nullable: true }
        charging: { type: boolean, nullable: true }
        charge_type: { type: string, nullable: true }
        wifi_connected: { type: boolean, nullable: true }
        ssid: { type: string, nullable: true }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        gps_accuracy: { type: number, nullable: true }
        location_time: { type: integer, format: int64, nullable: true }
        location_name: { type: string, nullable: true, description: "Reverse-geocoded place name of the last fix; null while unresolved or when geocoding is off" }
        location_name_at: { type: integer, format: int64, nullable: true, description: "Unix seconds the name was resolved" }
        safe_place:
          type: object
          nullable: true
          description: "The safe place the last fix lies in (overlaps: smallest distance/radius ratio wins); null when in none or without a location. Computed, never stored."
          required: [id, name]
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
        device_info: { type: string, nullable: true }
        screen_locked: { type: boolean, nullable: true }
        last_seen: { type: integer, format: int64 }
        created_at: { type: integer, format: int64 }
